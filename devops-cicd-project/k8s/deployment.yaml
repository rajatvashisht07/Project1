apiVersion: apps/v1
kind: Deployment

metadata:
  name: devops-cicd-deployment

spec:
  replicas: 0

  selector:
    matchLabels:
      app: devops-cicd

  template:
    metadata:
      labels:
        app: devops-cicd

    spec:
      containers:
        - name:flask-container-v1.0 
        - image:my-flas-app:1.0
          
